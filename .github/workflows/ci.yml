name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    uses: ./.github/workflows/firebase-hosting-merge.yml
    needs: test
    secrets: inherit

  create_release:
    uses: ./.github/workflows/create-release.yml
    needs: deploy
    permissions:
      contents: write
    
